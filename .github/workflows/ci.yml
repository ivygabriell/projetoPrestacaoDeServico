# O NOME DO JOB vira o nome do check que a proteção da `main` exige.
name: CI

# Roda em todo push de qualquer branch: a branch é checada no GitHub antes de ir para a main.
on:
  push:
    branches: ['**']

permissions:
  contents: read

# Um push novo na mesma branch cancela a execução antiga.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Testes, tipos e build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      # O teste do build abre a página num navegador: o Chromium do Playwright desenha WebGL sem GPU.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:build
